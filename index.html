<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strict Shemos Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-xl">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">Strict Shemos Detector</h1>
        <p class="text-sm text-center text-gray-500 mb-6">Scanning for explicit configurations (including standalone or prefixed אלהי).</p>

        <div class="relative bg-black rounded-lg overflow-hidden aspect-video mb-4 flex items-center justify-center border border-gray-300">
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="absolute inset-0 w-full h-full object-cover hidden"></canvas>
            <div id="loader" class="absolute inset-0 bg-black/70 flex flex-col items-center justify-center text-white hidden">
                <div class="animate-spin rounded-full h-12 w-12 border-4 border-t-blue-500 border-gray-300 mb-2"></div>
                <p id="status-text" class="text-sm font-medium">Initializing...</p>
            </div>
        </div>

        <div class="flex gap-2">
            <button id="scan-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 cursor-pointer text-center shadow-md">
                Scan Page
            </button>
            <button id="reset-btn" class="hidden bg-gray-500 hover:bg-gray-600 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 cursor-pointer text-center shadow-md">
                Clear / Unfreeze
            </button>
        </div>

        <div id="result-box" class="mt-6 p-4 rounded-xl border hidden">
            <h3 id="result-title" class="font-bold text-lg mb-1"></h3>
            <p id="result-desc" class="text-sm text-gray-700 mb-3"></p>
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 max-h-40 overflow-y-auto">
                <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider block mb-1">Detected Raw Text:</span>
                <p id="raw-text" class="text-right font-serif text-lg leading-relaxed text-gray-800" dir="rtl"></p>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const scanBtn = document.getElementById('scan-btn');
        const resetBtn = document.getElementById('reset-btn');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('status-text');
        const resultBox = document.getElementById('result-box');
        const resultTitle = document.getElementById('result-title');
        const resultDesc = document.getElementById('result-desc');
        const rawTextDisplay = document.getElementById('raw-text');

        const prefixes = "[בהולמשכ]?";

        const strictShemosPatterns = [
            { 
                name: "Tetragrammaton (יהוה)", 
                regex: new RegExp(`^${prefixes}יהוה$`) 
            },
            { 
                name: "Elokim (אלהים)", 
                regex: new RegExp(`^${prefixes}אלהים$`) 
            },
            { 
                name: "Standalone Double-Yod (יי)", 
                regex: new RegExp(`^${prefixes}יי$`) 
            },
            { 
                name: "Elokei (אלהי)", 
                // Updated to allow 0 or 1 prefix letters
                regex: new RegExp(`^${prefixes}אלהי$`) 
            }
        ];

        async function startCamera() {
            showLoader("Accessing webcam...");
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                hideLoader();
            } catch (err) {
                showLoader("Camera Error: Please allow permissions and refresh.");
                document.querySelector('.animate-spin').style.display = 'none';
            }
        }

        function showLoader(text) {
            statusText.innerText = text;
            loader.classList.remove('hidden');
            scanBtn.disabled = true;
        }

        function hideLoader() {
            loader.classList.add('hidden');
            scanBtn.disabled = false;
        }

        async function scanImage() {
            showLoader("Capturing frame...");
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            video.classList.add('hidden');
            canvas.classList.remove('hidden');
            scanBtn.classList.add('hidden');
            resetBtn.classList.remove('hidden');
            
            showLoader("Analyzing strict criteria (OCR)...");
            
            try {
                const worker = await Tesseract.createWorker('heb');
                const ret = await worker.recognize(canvas);
                const words = ret.data.words;
                await worker.terminate();

                processResults(ctx, words, ret.data.text);
            } catch (error) {
                console.error(error);
                alert("OCR Processing failed.");
                resetScanner();
            }
        }

        function processResults(ctx, words, totalText) {
            hideLoader();
            rawTextDisplay.innerText = totalText.replace(/\s+/g, ' ') || "[No text found]";
            
            let foundNamesSet = new Set();
            let matchesCount = 0;

            words.forEach(word => {
                const cleanWord = word.text.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"']/g,"").trim();

                strictShemosPatterns.forEach(pattern => {
                    if (pattern.regex.test(cleanWord)) {
                        foundNamesSet.add(pattern.name);
                        matchesCount++;

                        const box = word.bbox;
                        ctx.strokeStyle = '#ef4444';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(box.x0, box.y0, (box.x1 - box.x0), (box.y1 - box.y0));

                        ctx.fillStyle = 'rgba(239, 68, 68, 0.15)';
                        ctx.fillRect(box.x0, box.y0, (box.x1 - box.x0), (box.y1 - box.y0));
                    }
                });
            });

            resultBox.classList.remove('hidden');
            if (matchesCount > 0) {
                resultBox.className = "mt-6 p-4 rounded-xl border bg-red-50 border-red-200 text-red-900";
                resultTitle.innerText = `⚠️ Strict Shemos Match Found (${matchesCount})`;
                resultDesc.innerText = `Detected instances matching your criteria: ${Array.from(foundNamesSet).join(", ")}.`;
            } else {
                resultBox.className = "mt-6 p-4 rounded-xl border bg-green-50 border-green-200 text-green-900";
                resultTitle.innerText = "✅ Clear";
                resultDesc.innerText = "No text matched the strict name criteria specified.";
            }
        }

        function resetScanner() {
            canvas.classList.add('hidden');
            resultBox.classList.add('hidden');
            resetBtn.classList.add('hidden');
            video.classList.remove('hidden');
            scanBtn.classList.remove('hidden');
            hideLoader();
        }

        scanBtn.addEventListener('click', scanImage);
        resetBtn.addEventListener('click', resetScanner);
        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
